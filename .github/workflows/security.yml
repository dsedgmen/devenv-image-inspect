name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: |
          shellcheck bin/devenv-image-inspect install.sh scripts/rpm-version.sh

  syntax:
    name: Script and editor config syntax
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf install -y git neovim vim-enhanced
      - uses: actions/checkout@v5
      - name: bash -n + nvim/vim load
        run: |
          set -euo pipefail
          chmod +x bin/devenv-image-inspect install.sh scripts/rpm-version.sh
          bash -n bin/devenv-image-inspect install.sh scripts/rpm-version.sh
          nvim --headless -u NONE -i NONE \
            -c 'set rtp+=.' \
            -c 'lua require("image-inspect").setup({map_keys=false})' \
            -c quit
          vim -Nu NONE -e -s \
            --cmd 'set rtp+=.' \
            -c 'runtime! plugin/image-inspect.vim' \
            -c quit
